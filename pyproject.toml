[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issuebuilder"
version = "0.3.0"
description = "Offline software that assembles journal issues from Word, ODT and PDF articles."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
# `python -m issuebuilder doctor` reports which ones are missing.
dependencies = [
    "python-docx>=1.1",
    "pikepdf>=8",
    "reportlab>=4",
    "pdfplumber>=0.10",
    "pypdfium2>=4",
    "Pillow>=10",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
issuebuilder = "issuebuilder.__main__:main"

[project.gui-scripts]
journal-issue-builder = "issuebuilder.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
