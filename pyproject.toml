[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issuebuilder"
version = "0.1.0"
description = "Offline software that assembles journal issues from Word, ODT and PDF articles."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
# Python libraries the full program needs. Milestones 0 and 1 run without them;
# `python -m issuebuilder doctor` reports which ones are missing.
dependencies = [
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
issuebuilder = "issuebuilder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
