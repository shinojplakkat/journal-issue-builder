# Builds the Windows installer and the Ubuntu package.
# Runs only when a version tag (v0.1.0, v0.2.0, ...) is pushed, or when started by hand
# from the Actions tab. Ordinary pushes do not start it.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install LibreOffice (for the tests)
        run: choco install libreoffice-fresh -y --no-progress
      - name: Tests (formulas, full pipeline, program window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: System check
        run: python -m issuebuilder doctor; exit 0
      - name: Build program folder
        run: python packaging/build_app.py
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}".TrimStart("v")
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 1

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-core ghostscript \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests (formulas, full pipeline, program window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: System check
        run: python -m issuebuilder doctor || true
      - name: Build program folder and .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0"
          python packaging/build_app.py
          bash packaging/linux/build_deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: dist/*.deb
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Journal Issue Builder ${GITHUB_REF_NAME#v}" \
            --notes "Windows: run the Setup .exe (installs for the current user, no administrator password). Ubuntu: sudo apt install ./journal-issue-builder_*.deb. LibreOffice must be installed."
