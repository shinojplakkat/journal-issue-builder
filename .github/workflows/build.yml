# Builds the Windows installer and the Ubuntu package, and publishes them as a release.
# Runs when the version number in src/issuebuilder/__init__.py changes (or this file
# changes), or when started by hand from the Actions tab. Other pushes do not start it.
name: Build installers

on:
  push:
    branches: [main]
    paths:
      - "src/issuebuilder/__init__.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install LibreOffice (for the tests)
        run: choco install libreoffice-fresh -y --no-progress
      - name: Tests (formulas, full pipeline, program window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v -p no:cacheprovider
      - name: System check
        run: python -m issuebuilder doctor; exit 0
      - name: Build program folder
        run: python packaging/build_app.py
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import issuebuilder; print(issuebuilder.__version__)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 1

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-core ghostscript \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests (formulas, full pipeline, program window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v -p no:cacheprovider
      - name: System check
        run: python -m issuebuilder doctor || true
      - name: Build program folder and .deb
        run: |
          VERSION=$(python -c "import issuebuilder; print(issuebuilder.__version__)")
          python packaging/build_app.py
          bash packaging/linux/build_deb.sh "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: ubuntu-package
          path: dist/*.deb
          retention-days: 1

  release:
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Publish release (creates the version tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/issuebuilder/__init__.py)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists: raise the version number to publish a new one."
            exit 1
          fi
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Journal Issue Builder $VERSION" \
            --notes "Windows: run the Setup .exe (installs for the current user, no administrator password). Ubuntu: sudo apt install ./journal-issue-builder_*.deb. LibreOffice must be installed."
